{% extends 'base.html' %}
{% block title %}Sign In — OEMS{% endblock %}

{% block auth_content %}

<!-- ── Login Card ── -->
<div class="glass-dark rounded-2xl overflow-hidden shadow-2xl physics-element">

  <!-- Colorful top accent bar -->
  <div class="h-1" style="background: linear-gradient(90deg, #06B6D4, #6366F1, #8B5CF6)"></div>

  <div class="p-6 md:p-8">

    <!-- Header: logo + title -->
    <div class="text-center mb-7">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4"
           style="background: linear-gradient(135deg, #06B6D4, #6366F1)">
        <i class="fas fa-graduation-cap text-white text-2xl"></i>
      </div>
      <h1 class="font-syne font-bold text-white text-2xl">Welcome back</h1>
      <p class="text-slate-400 text-sm mt-1">Sign in to your OEMS account</p>
    </div>

    <!-- Login Form -->
    <form action="{{ url_for('login') }}" method="POST" class="space-y-4">

      <!-- Email field -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Email</label>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500">
            <i class="fas fa-envelope text-sm"></i>
          </span>
          <input type="email" name="email" required placeholder="you@example.com"
                 class="w-full pl-9 pr-4 py-2.5 bg-white/5 border border-white/10 rounded-xl
                        text-sm text-white placeholder-slate-500
                        focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/40
                        outline-none transition">
        </div>
      </div>

      <!-- Password field with show/hide toggle -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
          <a href="{{ url_for('forgot_password') }}" class="text-xs text-cyan-400 hover:text-cyan-300 transition">
            Forgot?
          </a>
        </div>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500">
            <i class="fas fa-lock text-sm"></i>
          </span>
          <input type="password" name="password" id="pw-field" required placeholder="••••••••"
                 class="w-full pl-9 pr-10 py-2.5 bg-white/5 border border-white/10 rounded-xl
                        text-sm text-white placeholder-slate-500
                        focus:ring-2 focus:ring-cyan-500/50 outline-none transition">
          <!-- Eye icon to toggle password visibility -->
          <button type="button" onclick="togglePassword()" title="Show/hide password"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition">
            <i class="fas fa-eye text-sm" id="pw-eye"></i>
          </button>
        </div>
      </div>

      <!-- Submit button -->
      <button type="submit"
              class="w-full py-2.5 rounded-xl text-sm font-bold text-white mt-1
                     transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0"
              style="background: linear-gradient(135deg, #06B6D4, #3B82F6);
                     box-shadow: 0 4px 16px rgba(6,182,212,0.38)">
        Sign In <i class="fas fa-arrow-right ml-1 text-xs"></i>
      </button>

    </form>

  <!-- Footer link to register -->
  <div class="px-8 py-4 border-t border-white/5 text-center text-xs text-slate-500">
    No account?
    <a href="{{ url_for('register') }}" class="text-cyan-400 font-semibold hover:text-cyan-300 transition ml-1">
      Register now
    </a>
  </div>

</div>

<script>
  /* Toggle password field between text and password type */
  function togglePassword() {
    var field = document.getElementById('pw-field');
    var eye   = document.getElementById('pw-eye');
    var isHidden = field.type === 'password';

    field.type = isHidden ? 'text' : 'password';
    eye.classList.toggle('fa-eye',       !isHidden);
    eye.classList.toggle('fa-eye-slash',  isHidden);
  }

  /* One-click demo login: fills email + default password */
  function fillLogin(email) {
    document.querySelector('input[name="email"]').value    = email;
    document.querySelector('input[name="password"]').value = 'password123';
  }
</script>

{% endblock %}
