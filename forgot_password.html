{% extends 'base.html' %}
{% block title %}Reset Password — OEMS{% endblock %}

{% block auth_content %}

<!-- Reset password card -->
<div class="glass-dark rounded-2xl overflow-hidden shadow-2xl physics-element">

  <!-- Top accent bar -->
  <div class="h-1" style="background: linear-gradient(90deg, #F59E0B, #F43F5E)"></div>

  <div class="p-6 md:p-8">

    <!-- Header -->
    <div class="text-center mb-7">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4"
           style="background: linear-gradient(135deg, #F59E0B, #F43F5E)">
        <i class="fas fa-key text-white text-2xl"></i>
      </div>
      <h1 class="font-syne font-bold text-white text-2xl">Reset Password</h1>
      <p class="text-slate-400 text-sm mt-1">Enter your email and security PIN to reset</p>
    </div>

    <!-- Reset form -->
    <form action="{{ url_for('forgot_password') }}" method="POST" class="space-y-4">

      <!-- Email -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Email</label>
        <input type="email" name="email" required placeholder="you@example.com"
               class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl
                      text-sm text-white placeholder-slate-500
                      focus:ring-2 focus:ring-amber-500/50 outline-none transition">
      </div>

      <!-- Security PIN -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Security PIN</label>
        <input type="text" name="security_pin" pattern="[0-9]{4}" maxlength="4"
               required placeholder="4-digit PIN"
               class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl
                      text-sm text-white placeholder-slate-500
                      focus:ring-2 focus:ring-amber-500/50 outline-none transition">
      </div>

      <!-- New password -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">New Password</label>
        <input type="password" name="new_password" required placeholder="Your new password"
               class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl
                      text-sm text-white placeholder-slate-500
                      focus:ring-2 focus:ring-amber-500/50 outline-none transition">
      </div>

      <!-- Submit -->
      <button type="submit"
              class="w-full py-2.5 rounded-xl text-sm font-bold text-white mt-1
                     transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0"
              style="background: linear-gradient(135deg, #F59E0B, #F43F5E);
                     box-shadow: 0 4px 16px rgba(245,158,11,0.35)">
        Reset Password <i class="fas fa-arrow-right ml-1 text-xs"></i>
      </button>

    </form>
  </div>

  <!-- Footer link back to login -->
  <div class="px-8 py-4 border-t border-white/5 text-center text-xs text-slate-500">
    <a href="{{ url_for('login') }}"
       class="text-cyan-400 font-semibold hover:text-cyan-300 transition flex items-center justify-center gap-1">
      <i class="fas fa-arrow-left text-[10px]"></i> Back to Login
    </a>
  </div>

</div>

{% endblock %}
