{% extends 'base.html' %}
{% block title %}Register — OEMS{% endblock %}

{% block auth_content %}

<!-- Register card -->
<div class="glass-dark rounded-2xl overflow-hidden shadow-2xl physics-element">

  <!-- Top accent bar -->
  <div class="h-1" style="background: linear-gradient(90deg, #10B981, #06B6D4, #6366F1)"></div>

  <div class="p-6 md:p-8">

    <!-- Header -->
    <div class="text-center mb-6">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4"
           style="background: linear-gradient(135deg, #10B981, #06B6D4)">
        <i class="fas fa-user-plus text-white text-2xl"></i>
      </div>
      <h1 class="font-syne font-bold text-white text-2xl">Create Account</h1>
      <p class="text-slate-400 text-sm mt-1">Join the OEMS platform</p>
    </div>

    <!-- Registration form -->
    <form action="{{ url_for('register') }}" method="POST" class="space-y-4">

      <!-- Full name -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">
          Full Name
        </label>
        <input type="text" name="name" required placeholder="Jane Doe"
               class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl
                      text-sm text-white placeholder-slate-500
                      focus:ring-2 focus:ring-cyan-500/50 outline-none transition">
      </div>

      <!-- Email -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">
          Email
        </label>
        <input type="email" name="email" required placeholder="you@example.com"
               class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl
                      text-sm text-white placeholder-slate-500
                      focus:ring-2 focus:ring-cyan-500/50 outline-none transition">
      </div>

      <!-- Role + Security PIN side by side -->
      <div class="grid grid-cols-2 gap-3">

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">
            Role
          </label>
          <!-- Admin registration is disabled for security -->
          <select name="role" required
                  class="w-full px-3 py-2.5 bg-white/5 border border-white/10 rounded-xl
                         text-sm text-white outline-none focus:ring-2 focus:ring-cyan-500/50 transition">
            <option value="student" class="bg-slate-800">Student</option>
            <option value="teacher" class="bg-slate-800">Teacher</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">
            Security PIN
          </label>
          <!-- 4-digit PIN used for password recovery -->
          <input type="text" name="security_pin" pattern="[0-9]{4}" maxlength="4"
                 required placeholder="4 digits"
                 class="w-full px-3 py-2.5 bg-white/5 border border-white/10 rounded-xl
                        text-sm text-white placeholder-slate-500
                        focus:ring-2 focus:ring-cyan-500/50 outline-none transition">
        </div>

      </div>

      <!-- Password -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">
          Password
        </label>
        <input type="password" name="password" required placeholder="Minimum 6 characters"
               class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl
                      text-sm text-white placeholder-slate-500
                      focus:ring-2 focus:ring-cyan-500/50 outline-none transition">
      </div>

      <!-- Submit -->
      <button type="submit"
              class="w-full py-2.5 rounded-xl text-sm font-bold text-white mt-1
                     transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0"
              style="background: linear-gradient(135deg, #10B981, #06B6D4);
                     box-shadow: 0 4px 16px rgba(16,185,129,0.35)">
        Create Account <i class="fas fa-arrow-right ml-1 text-xs"></i>
      </button>

    </form>
  </div>

  <!-- Footer link -->
  <div class="px-8 py-4 border-t border-white/5 text-center text-xs text-slate-500">
    Already have an account?
    <a href="{{ url_for('login') }}" class="text-cyan-400 font-semibold hover:text-cyan-300 transition ml-1">
      Sign in
    </a>
  </div>

</div>

{% endblock %}
