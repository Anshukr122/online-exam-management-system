{% extends 'base.html' %}
{% block title %}Create Exam — OEMS{% endblock %}
{% block page_label %}Create Exam{% endblock %}

{% block content %}

<!-- Page Header -->
<div class="page-header mb-5 anim-in">
  <a href="{{ url_for('exams') }}"
     class="text-xs font-semibold text-cyan-500 hover:text-cyan-600 flex items-center gap-1 mb-2 transition">
    <i class="fas fa-arrow-left text-[10px]"></i> Back to Exams
  </a>
  <h1>Create New Exam</h1>
  <p class="text-sm text-slate-500 mt-1">Set up your exam details, then add questions</p>
</div>


<!-- Form card: max-width so it doesn't stretch too wide on desktop -->
<div class="w-full max-w-lg anim-in">
  <div class="glass rounded-2xl p-5 md:p-6 physics-element">

    <form method="POST" class="space-y-5">

      <!-- Exam title input -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">
          Exam Title <span class="text-rose-400">*</span>
        </label>
        <input type="text" name="title" required
               placeholder="e.g. Python Fundamentals Quiz"
               class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm
                      focus:ring-2 focus:ring-cyan-400 focus:border-transparent
                      outline-none transition bg-white">
      </div>

      <!-- Duration input -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">
          Duration <span class="text-rose-400">*</span>
          <span class="text-slate-400 font-normal text-xs ml-1">(in minutes)</span>
        </label>
        <input type="number" name="duration" min="1" max="300" required
               placeholder="30"
               class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm
                      focus:ring-2 focus:ring-cyan-400 focus:border-transparent
                      outline-none transition bg-white">
      </div>

      <!-- Action buttons: Cancel + Submit -->
      <div class="flex flex-col sm:flex-row justify-end gap-3 pt-2">
        <a href="{{ url_for('exams') }}"
           class="text-center px-5 py-2.5 text-sm font-semibold text-slate-600
                  bg-slate-100 hover:bg-slate-200 rounded-xl transition">
          Cancel
        </a>
        <button type="submit" class="btn-primary px-5 py-2.5 rounded-xl text-sm justify-center">
          <i class="fas fa-arrow-right text-xs"></i> Create & Add Questions
        </button>
      </div>

    </form>
  </div>
</div>

{% endblock %}
